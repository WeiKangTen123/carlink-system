version: '3.8'

# Container names: ${CARLINK_NAME:-carlink}_<service>. Production leaves
# CARLINK_NAME unset (carlink_api, carlink_nginx, ... as always); a staging
# stack sets CARLINK_NAME=carlink_staging and runs as its own compose project
# (infra/docker-compose.staging.yml, infra/README.md "Staging").

# Both telegram-bot and api are the SAME image (apps/bot-service) with a
# different startup command -- they share one Docker volume for photos/PDFs
# and the SQLite database, since they're really one application split into
# two processes (an outbound Telegram poller, and an inbound HTTP server).
# Previously only the bot process was ever started, so nothing listened on
# port 8000 -- that's why the dashboard/API were unreachable.

# Caps each container's logs at 10MB x 3 files. Without this, the json-file
# log driver has no size limit -- with restart:always and telegram-bot/api
# logging every poll and request, that grows unbounded over weeks of uptime
# and can quietly fill this VM's small (~10GB) disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-bot-service: &bot-service
  build:
    context: ../apps/bot-service
    dockerfile: Dockerfile
  restart: always
  logging: *default-logging
  environment:
    - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY must be set}
    # Optional here (a staging stack runs without a bot); infra/deploy.sh
    # still refuses a production deploy without it.
    - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    # Where people open Carlink (app/config.py public_base_url): the bot's
    # case links and "connect first" message. Both api and bot get it. Set
    # it in each stack's infra/.env; the default is production's address.
    - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://carlink.34-16-92-98.sslip.io}
    # Kept in sync with config.py's default -- see the comment there for
    # why this order (bbox-capable models first, -lite models as the
    # always-available fallback) and why antigravity was dropped (no
    # image input support, so it could never serve a photo-analysis call).
    # Contract 9 (owner, 15 Nov): 3.6-flash shares the 20/day bucket of the
    # free tier's 3.5-flash and 3.7-flash only ever answered 503, so after
    # the strong model the light models take over directly.
    - GEMINI_MODEL_CHAIN=${GEMINI_MODEL_CHAIN:-gemini-3-flash-preview,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
    - STORAGE_DIR=/app/storage
    - DATABASE_URL=sqlite:////app/storage/carlink.db
    # ai-keys.secret, which seals people's own AI keys (app/ai/secretbox.py).
    # Its own volume (ai_secrets below), not under /app/storage: /files
    # serves storage and backup.sh copies it.
    - SECRETS_DIR=/app/secrets
    # Sweeps idle intake drafts / stale tmp uploads (app/intake/cleanup.py).
    # Only the api process acts on it; the bot process has no lifespan.
    - RUN_BACKGROUND_CLEANUP=true
    # The parts-catalogue look-up (app/api/catalogue.py): off unless both
    # are set in infra/.env on the server (git-ignored; compose v2 reads it
    # because this file's folder, infra/, is the project folder -- not the
    # shell that runs deploy.sh, which a later `up` wouldn't have). The token
    # is what the parts-worker container below sends, so the same value goes
    # to both, from infra/.env only, never git. Only the api serves the
    # look-up (the list above is shared, so the bot gets them too and
    # ignores them). Empty token = off. tools/parts_mcp/README.md "Running
    # on the server".
    - CATALOGUE_ENABLED=${CATALOGUE_ENABLED:-false}
    - CATALOGUE_WORKER_TOKEN=${CATALOGUE_WORKER_TOKEN:-}
    # Contract 9 reading (app/config.py): zone reads, zone-only finds as
    # tick-to-add suggestions, and their reasons/boxes. The defaults here are
    # config.py's (today's single read); the live values are set in
    # infra/.env on the server, like the catalogue's.
    - INTAKE_READ_MODE=${INTAKE_READ_MODE:-single}
    - INTAKE_ZONE_ONLY=${INTAKE_ZONE_ONLY:-suggest}
    - INTAKE_ZONE_EVIDENCE=${INTAKE_ZONE_EVIDENCE:-off}
    - INTAKE_CHECK_MODE=${INTAKE_CHECK_MODE:-off}
    # Contract 10: linked parts in detection, the linked check, the parts
    # catalogue's diagram neighbours as candidates, and staff Telegram photos
    # on the same full detection. Defaults are config.py's (all off; the
    # frozen L1 cap of 12); live values go in infra/.env, like contract 9's.
    # Both containers need the same values: with TELEGRAM_FULL_DETECTION on,
    # the bot's own process runs the pipeline (app/intake/telegram_bridge.py)
    # with the bot's settings.
    - TELEGRAM_FULL_DETECTION=${TELEGRAM_FULL_DETECTION:-false}
    - INTAKE_LINKS=${INTAKE_LINKS:-off}
    - INTAKE_LINK_CHECK=${INTAKE_LINK_CHECK:-off}
    - INTAKE_LINKS_CATALOGUE=${INTAKE_LINKS_CATALOGUE:-false}
    - INTAKE_LINKS_MAX=${INTAKE_LINKS_MAX:-12}
    # Light-model detection (plans/2026-11-18-light-detection): instruction
    # packs and prompt versions, one switch per benchmark experiment, and
    # the sort's and linked check's thinking levels (blank = none sent).
    # Defaults are config.py's: today's prompts byte for byte. Live values
    # go in infra/.env once an experiment has won.
    - INTAKE_READ_PACKS=${INTAKE_READ_PACKS:-}
    - INTAKE_READ_PROMPT=${INTAKE_READ_PROMPT:-v1}
    - INTAKE_READ_ANCHOR=${INTAKE_READ_ANCHOR:-false}
    - INTAKE_ZONE_PACKS=${INTAKE_ZONE_PACKS:-}
    - INTAKE_ZONE_PHOTO_HALF=${INTAKE_ZONE_PHOTO_HALF:-false}
    - INTAKE_SORT_PROMPT=${INTAKE_SORT_PROMPT:-v2}
    - GEMINI_THINKING_LEVEL_SORT=${GEMINI_THINKING_LEVEL_SORT:-}
    - GEMINI_THINKING_LEVEL_LINK=${GEMINI_THINKING_LEVEL_LINK:-}
    - INTAKE_LINK_SKILL=${INTAKE_LINK_SKILL:-L1}
    - INTAKE_LINK_PROMPT=${INTAKE_LINK_PROMPT:-v1}
    - INTAKE_LINK_SIGNS=${INTAKE_LINK_SIGNS:-false}
    - INTAKE_LINK_ORDER=${INTAKE_LINK_ORDER:-candidates_first}
    # The assembly walk (plans/2026-11-18-car-knowledge/K1-design.md 5a):
    # yes/no signs inside the zone reads, how far a yes lifts a hit, and the
    # car map's second hop. Defaults are config.py's: off, today's requests
    # and linked parts byte for byte.
    - INTAKE_ASSEMBLY_WALK=${INTAKE_ASSEMBLY_WALK:-off}
    - INTAKE_WALK_RAISE=${INTAKE_WALK_RAISE:-one}
    - INTAKE_LINK_HOPS=${INTAKE_LINK_HOPS:-1}
    # The car map (plans/2026-11-18-car-knowledge/K1-design.md 6): which link
    # table the linked parts come from, and the Review step's order and caps
    # (K4). Defaults are config.py's: L1, its order, 4 per group, strip-down
    # inside the 12.
    - INTAKE_CAR_MAP=${INTAKE_CAR_MAP:-off}
    - INTAKE_LINKS_ORDER=${INTAKE_LINKS_ORDER:-table}
    - INTAKE_LINKS_ASSEMBLY_MAX=${INTAKE_LINKS_ASSEMBLY_MAX:-4}
    - INTAKE_LINKS_STRIPDOWN_CAP=${INTAKE_LINKS_STRIPDOWN_CAP:-in}
    - INTAKE_LINKS_STRIPDOWN_MAX=${INTAKE_LINKS_STRIPDOWN_MAX:-12}
    # The car map's own part names (app/config.py intake_car_map_names):
    # offered in the part pickers and named by the car map's linked parts.
    # Off by default; both containers read it (the bot runs the pipeline).
    - INTAKE_CAR_MAP_NAMES=${INTAKE_CAR_MAP_NAMES:-off}
    # The detection fixes (plans/2026-11-22-enhance-staging section 2, F1-F7):
    # a failed main read falls back to the zone reads, what the caps cut is
    # kept (folded), a placed side-undetermined find on another photo stays
    # as an "Other side?" suggestion, the linked check's "no" on a hidden
    # part, and one more sort batch for skipped photos. Defaults are
    # config.py's: today's behaviour, requests and saved drafts byte for byte.
    - INTAKE_MAIN_READ_FALLBACK=${INTAKE_MAIN_READ_FALLBACK:-off}
    - INTAKE_KEEP_CUT=${INTAKE_KEEP_CUT:-off}
    - INTAKE_KEEP_OTHER_SIDE=${INTAKE_KEEP_OTHER_SIDE:-off}
    - INTAKE_LINK_HIDDEN_NO=${INTAKE_LINK_HIDDEN_NO:-keep}
    - INTAKE_SORT_RETRY_SKIPPED=${INTAKE_SORT_RETRY_SKIPPED:-off}
    # The batching items (plans/2026-11-22-enhance-staging/R-batching.md B2-B5,
    # B9): the main read and the zone reads at once, the linked check's calls
    # at once, sort workers, keeping the sorter's label on a regroup, and a
    # rescue sort. Defaults are config.py's: today's behaviour byte for byte.
    # INTAKE_PARALLEL_READS acts only with INTAKE_MAIN_READ_FALLBACK=zones.
    - INTAKE_PARALLEL_READS=${INTAKE_PARALLEL_READS:-off}
    - INTAKE_LINK_CHECK_PARALLEL=${INTAKE_LINK_CHECK_PARALLEL:-off}
    - INTAKE_SORT_WORKERS=${INTAKE_SORT_WORKERS:-3}
    - INTAKE_KEEP_SORT_LABEL=${INTAKE_KEEP_SORT_LABEL:-off}
    - INTAKE_SORT_RESCUE=${INTAKE_SORT_RESCUE:-off}
    # Wave 2's accuracy switches (plans/2026-11-22-enhance-staging 3c): more
    # photos for the main read (E12; blank = 32) and its own photo size
    # (E12b; blank = as the other reads), the side worked out from the
    # sort's geometry (E7), a "wrong end" zone read's finds (E11), the
    # linked check's areas (E9a). Defaults are config.py's: today's
    # behaviour byte for byte.
    - INTAKE_MAX_READ_PHOTOS=${INTAKE_MAX_READ_PHOTOS:-}
    - GEMINI_IMAGE_RESOLUTION_MAIN_READ=${GEMINI_IMAGE_RESOLUTION_MAIN_READ:-}
    - INTAKE_SIDE_GEOMETRY=${INTAKE_SIDE_GEOMETRY:-off}
    - INTAKE_ZONE_WRONG_END=${INTAKE_ZONE_WRONG_END:-drop}
    - INTAKE_LINK_CHECK_MAX_CALLS=${INTAKE_LINK_CHECK_MAX_CALLS:-2}
    # Detection Round 2 (app/config.py intake_box_every, intake_zone_inventory;
    # zone mode only, no extra Gemini call): a box on every listed part the
    # zone reads see (R2-box), and the zone reads' per-photo inventory with
    # its damaged parts as suggestions (R2-inv). Defaults are config.py's: "off",
    # today's behaviour byte for byte.
    - INTAKE_BOX_EVERY=${INTAKE_BOX_EVERY:-off}
    - INTAKE_ZONE_INVENTORY=${INTAKE_ZONE_INVENTORY:-off}
    # Photo storage (owner, 23 Nov 2026; app/config.py photo_store_compress):
    # "on" re-saves each JPEG original at quality 85, same pixel size, its
    # EXIF (GPS included) dropped. Both containers store photos (the bot:
    # Telegram reports). Default is config.py's: "off", stored as uploaded.
    - PHOTO_STORE_COMPRESS=${PHOTO_STORE_COMPRESS:-off}
    # Phase 1 (report checks, review M4): the AI's transmission and static
    # check words in the firm's words, by meaning (app/reports/firm_words.py).
    # Default off = config.py's: every reading's values byte for byte as before.
    - INTAKE_FIRM_WORDS=${INTAKE_FIRM_WORDS:-off}
    # Detection Round 1 (owner, 25 Nov 2026; app/intake/sorter_hints.py): the
    # sorter's own finds as suggestions (A1: off / shadow / on), a zone read's
    # "intact" never hiding a part the sorter saw damaged (A2: old / shadow /
    # strict). Defaults are config.py's: today's behaviour byte for byte.
    - INTAKE_SORTER_HINTS=${INTAKE_SORTER_HINTS:-off}
    - INTAKE_INTACT_RULE=${INTAKE_INTACT_RULE:-old}
  # volumes: set per service below -- the two mount ai_secrets differently,
  # and a service's own volumes list replaces this one rather than adding.

services:
  telegram-bot:
    <<: *bot-service
    container_name: ${CARLINK_NAME:-carlink}_telegram_bot
    command: ["python", "-m", "app.main", "--bot-only"]
    volumes:
      - bot_data:/app/storage
      - ../apps/bot-service/app:/app/app
      # Read-only: the bot only reads the secret the api makes.
      - ai_secrets:/app/secrets:ro

  api:
    <<: *bot-service
    container_name: ${CARLINK_NAME:-carlink}_api
    command: ["python", "-m", "uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - bot_data:/app/storage
      - ../apps/bot-service/app:/app/app
      # The api makes the secret on its first start, and never replaces it.
      # Without this volume's file, own AI keys are off ("lost" in System
      # info) until it's put back or reset (see infra/backup.sh); company
      # keys are unaffected.
      - ai_secrets:/app/secrets
    # Not published to the host -- the browser only ever reaches this via
    # nginx's /api/ and /files/ proxies (see lib/api.ts), and other
    # containers reach it over the Docker network by service name
    # regardless of host port publishing.

  dashboard:
    build:
      context: ../apps/dashboard
      dockerfile: Dockerfile
      args:
        # Same-origin relative paths -- the browser reaches these through
        # nginx's /api/ and /files/ proxies (see nginx.conf) instead of the
        # API container's port directly. See lib/api.ts for why.
        - NEXT_PUBLIC_API_BASE_URL=/api
        - NEXT_PUBLIC_FILES_BASE_URL=
    container_name: ${CARLINK_NAME:-carlink}_dashboard
    restart: always
    logging: *default-logging
    # Not published to the host either -- same reasoning as api's port,
    # plus this avoids clashing with anything else already using 3000 on a
    # shared host.
    environment:
      # Server-side rendering reaches the API over the private Docker
      # network instead of round-tripping out to the public IP and back.
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: ${CARLINK_NAME:-carlink}_nginx
    restart: always
    logging: *default-logging
    ports:
      # Host-side port is configurable (NGINX_PORT) so this can run
      # alongside another app/nginx already on 80 on a shared host.
      # Bound to localhost by default: the host's own nginx terminates
      # HTTPS (carlink.<ip>.sslip.io, see infra/host-nginx/) and proxies
      # here, so publishing it on every interface only added an unencrypted
      # second way in. Set NGINX_BIND=0.0.0.0 on a box with no host proxy.
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - dashboard

  # The parts-catalogue worker (tools/parts_mcp/worker.py, Dockerfile there):
  # claims look-up jobs from the api over this compose network and reads the
  # Microfiches catalogues (BMW, MINI, Honda) -- the only container that
  # contacts a parts site, slowly (5-8 s apart, 500 a day per site). Plain
  # http to "api" never leaves the VM; nginx.conf answers 404 to
  # /api/catalogue-worker/ from outside, so only this container reaches those
  # endpoints (with the token too). Without CATALOGUE_WORKER_TOKEN it idles;
  # while the api answers 404 (CATALOGUE_ENABLED off) it asks every 5 min.
  # Logs: docker logs carlink_parts_worker (one line per event).
  parts-worker:
    build:
      context: ../tools/parts_mcp
      dockerfile: Dockerfile
    container_name: ${CARLINK_NAME:-carlink}_parts_worker
    restart: unless-stopped
    logging: *default-logging
    environment:
      - CARLINK_API_BASE=http://api:8000
      # From infra/.env, as the api's (above).
      - CATALOGUE_WORKER_TOKEN=${CATALOGUE_WORKER_TOKEN:-}
      - PARTS_MCP_DATA_DIR=/data
      # The log goes to docker logs only (capped by the logging options
      # above), not to a second copy in the volume.
      - PARTS_MCP_LOG_FILE=off
      - WORKER_NAME=server
    volumes:
      # Page cache (pages.db) and catalogue store (catalogue.db): kept across
      # rebuilds, so nothing already looked up is fetched again.
      - parts_data:/data
    # A look-up holds one page and its parse at a time; this caps a runaway
    # at 512 MB on a VM other apps share. (deploy.resources is honoured by
    # docker compose v2 outside swarm; mem_limit would break this file for
    # docker-compose v1, which deploy.sh still prefers when present.)
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - api

volumes:
  bot_data:
  # Own AI keys secret (see SECRETS_DIR above). Not in backup.sh on purpose:
  # the keys in the database backups are sealed with it, and the two
  # shouldn't travel together.
  ai_secrets:
  # The parts-worker's caches. Not in backup.sh: everything in it can be
  # fetched again from the catalogue sites.
  parts_data:
