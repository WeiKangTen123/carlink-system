version: '3.8'

# Both telegram-bot and api are the SAME image (apps/bot-service) with a
# different startup command -- they share one Docker volume for photos/PDFs
# and the SQLite database, since they're really one application split into
# two processes (an outbound Telegram poller, and an inbound HTTP server).
# Previously only the bot process was ever started, so nothing listened on
# port 8000 -- that's why the dashboard/API were unreachable.

# Caps each container's logs at 10MB x 3 files. Without this, the json-file
# log driver has no size limit -- with restart:always and telegram-bot/api
# logging every poll and request, that grows unbounded over weeks of uptime
# and can quietly fill this VM's small (~10GB) disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-bot-service: &bot-service
  build:
    context: ../apps/bot-service
    dockerfile: Dockerfile
  restart: always
  logging: *default-logging
  environment:
    - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY must be set}
    - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN must be set}
    # Where people open Carlink (app/config.py public_base_url): the bot's
    # case links and "connect first" message. Both api and bot get it.
    - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://carlink.34-45-253-162.sslip.io}
    # Kept in sync with config.py's default -- see the comment there for
    # why this order (bbox-capable models first, -lite models as the
    # always-available fallback) and why antigravity was dropped (no
    # image input support, so it could never serve a photo-analysis call).
    - GEMINI_MODEL_CHAIN=${GEMINI_MODEL_CHAIN:-gemini-3-flash-preview,gemini-3.6-flash,gemini-3.7-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
    - STORAGE_DIR=/app/storage
    - DATABASE_URL=sqlite:////app/storage/carlink.db
    # ai-keys.secret, which seals people's own AI keys (app/ai/secretbox.py).
    # Its own volume (ai_secrets below), not under /app/storage: /files
    # serves storage and backup.sh copies it.
    - SECRETS_DIR=/app/secrets
    # Sweeps idle intake drafts / stale tmp uploads (app/intake/cleanup.py).
    # Only the api process acts on it; the bot process has no lifespan.
    - RUN_BACKGROUND_CLEANUP=true
    # The parts-catalogue look-up (app/api/catalogue.py): off unless both
    # are set in infra/.env on the server (git-ignored; compose v2 reads it
    # because this file's folder, infra/, is the project folder -- not the
    # shell that runs deploy.sh, which a later `up` wouldn't have). The token
    # is what the parts-worker container below sends, so the same value goes
    # to both, from infra/.env only, never git. Only the api serves the
    # look-up (the list above is shared, so the bot gets them too and
    # ignores them). Empty token = off. tools/parts_mcp/README.md "Running
    # on the server".
    - CATALOGUE_ENABLED=${CATALOGUE_ENABLED:-false}
    - CATALOGUE_WORKER_TOKEN=${CATALOGUE_WORKER_TOKEN:-}
  # volumes: set per service below -- the two mount ai_secrets differently,
  # and a service's own volumes list replaces this one rather than adding.

services:
  telegram-bot:
    <<: *bot-service
    container_name: carlink_telegram_bot
    command: ["python", "-m", "app.main", "--bot-only"]
    volumes:
      - bot_data:/app/storage
      - ../apps/bot-service/app:/app/app
      # Read-only: the bot only reads the secret the api makes.
      - ai_secrets:/app/secrets:ro

  api:
    <<: *bot-service
    container_name: carlink_api
    command: ["python", "-m", "uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - bot_data:/app/storage
      - ../apps/bot-service/app:/app/app
      # The api makes the secret on its first start, and never replaces it.
      # Without this volume's file, own AI keys are off ("lost" in System
      # info) until it's put back or reset (see infra/backup.sh); company
      # keys are unaffected.
      - ai_secrets:/app/secrets
    # Not published to the host -- the browser only ever reaches this via
    # nginx's /api/ and /files/ proxies (see lib/api.ts), and other
    # containers reach it over the Docker network by service name
    # regardless of host port publishing.

  dashboard:
    build:
      context: ../apps/dashboard
      dockerfile: Dockerfile
      args:
        # Same-origin relative paths -- the browser reaches these through
        # nginx's /api/ and /files/ proxies (see nginx.conf) instead of the
        # API container's port directly. See lib/api.ts for why.
        - NEXT_PUBLIC_API_BASE_URL=/api
        - NEXT_PUBLIC_FILES_BASE_URL=
    container_name: carlink_dashboard
    restart: always
    logging: *default-logging
    # Not published to the host either -- same reasoning as api's port,
    # plus this avoids clashing with anything else already using 3000 on a
    # shared host.
    environment:
      # Server-side rendering reaches the API over the private Docker
      # network instead of round-tripping out to the public IP and back.
      - API_INTERNAL_URL=http://api:8000
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: carlink_nginx
    restart: always
    logging: *default-logging
    ports:
      # Host-side port is configurable (NGINX_PORT) so this can run
      # alongside another app/nginx already on 80 on a shared host.
      # Bound to localhost by default: the host's own nginx terminates
      # HTTPS (carlink.<ip>.sslip.io, see infra/host-nginx/) and proxies
      # here, so publishing it on every interface only added an unencrypted
      # second way in. Set NGINX_BIND=0.0.0.0 on a box with no host proxy.
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - dashboard

  # The parts-catalogue worker (tools/parts_mcp/worker.py, Dockerfile there):
  # claims look-up jobs from the api over this compose network and reads the
  # Microfiches catalogues (BMW, MINI, Honda) -- the only container that
  # contacts a parts site, slowly (5-8 s apart, 500 a day per site). Plain
  # http to "api" never leaves the VM; nginx.conf answers 404 to
  # /api/catalogue-worker/ from outside, so only this container reaches those
  # endpoints (with the token too). Without CATALOGUE_WORKER_TOKEN it idles;
  # while the api answers 404 (CATALOGUE_ENABLED off) it asks every 5 min.
  # Logs: docker logs carlink_parts_worker (one line per event).
  parts-worker:
    build:
      context: ../tools/parts_mcp
      dockerfile: Dockerfile
    container_name: carlink_parts_worker
    restart: unless-stopped
    logging: *default-logging
    environment:
      - CARLINK_API_BASE=http://api:8000
      # From infra/.env, as the api's (above).
      - CATALOGUE_WORKER_TOKEN=${CATALOGUE_WORKER_TOKEN:-}
      - PARTS_MCP_DATA_DIR=/data
      # The log goes to docker logs only (capped by the logging options
      # above), not to a second copy in the volume.
      - PARTS_MCP_LOG_FILE=off
      - WORKER_NAME=server
    volumes:
      # Page cache (pages.db) and catalogue store (catalogue.db): kept across
      # rebuilds, so nothing already looked up is fetched again.
      - parts_data:/data
    # A look-up holds one page and its parse at a time; this caps a runaway
    # at 512 MB on a VM other apps share. (deploy.resources is honoured by
    # docker compose v2 outside swarm; mem_limit would break this file for
    # docker-compose v1, which deploy.sh still prefers when present.)
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - api

volumes:
  bot_data:
  # Own AI keys secret (see SECRETS_DIR above). Not in backup.sh on purpose:
  # the keys in the database backups are sealed with it, and the two
  # shouldn't travel together.
  ai_secrets:
  # The parts-worker's caches. Not in backup.sh: everything in it can be
  # fetched again from the catalogue sites.
  parts_data:
