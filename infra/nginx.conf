# Sign-in attempts per client address, on top of the API's own per-account
# lockout and per-address limit (bot-service app/api/auth.py).
limit_req_zone $binary_remote_addr zone=carlink_login:1m rate=10r/m;
# The public Request access form: a person sends one, a script hundreds.
limit_req_zone $binary_remote_addr zone=carlink_signup:1m rate=2r/m;

server {
    listen 80;
    server_name _;

    # The real client address, not the host nginx's (infra/host-nginx/
    # proxies here from the same machine, through Docker's bridge). The API
    # gets it as X-Real-IP for its sign-in limits; without this every
    # visitor looked like one address, so one person's wrong passwords
    # could block everyone.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Sign-in is done by the API (bot-service app/auth): every route behind
    # /api/, /files/ and /reports/*/download checks the session itself, and
    # the dashboard sends signed-out visitors to /login (apps/dashboard/
    # proxy.ts). Until 2026-10-22 this was nginx basic auth -- one shared
    # password -- and before 2026-10-21 there was no login at all.

    # Without this, nginx's default (1M) silently rejects photo uploads. The
    # largest legitimate request is one photo (intake uploads one per
    # request, 25MB cap) or a 25MB Server Action body; 30M covers both with
    # headroom without letting a single request push 100MB at the disk.
    client_max_body_size 30M;

    # Gzip Compression for 3D assets, JavaScript, CSS, and JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        model/gltf-binary
        model/gltf+json
        application/octet-stream;

    # Direct PDF Report Download Route
    # Proxies directly to FastAPI backend to avoid Next.js 404
    location ~ ^/reports/([^/]+)/download$ {
        proxy_pass http://api:8000/reports/$1/download;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static 3D Assets & Model Files with Browser Caching
    location /assets/ {
        proxy_pass http://dashboard:3000/assets/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # Next.js Static Client Bundles
    location /_next/static/ {
        proxy_pass http://dashboard:3000/_next/static/;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Web Dashboard UI (Next.js)
    location / {
        proxy_pass http://dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location = /api/auth/login {
        limit_req zone=carlink_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/auth/login;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public signup endpoints (app/api/signup.py). Host must pass through or
    # the API's same-site check refuses every browser POST; X-Real-IP feeds
    # its own per-network limits.
    location = /api/auth/access-requests {
        limit_req zone=carlink_signup burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/auth/access-requests;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/auth/links/ {
        limit_req zone=carlink_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:8000/auth/links/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # FastAPI REST Backend API
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # nginx's 60s default proxy_read_timeout cuts off report
        # creation/analysis for reports with many photos -- PDF rendering
        # (Playwright/Chromium) and multi-photo Gemini analysis both
        # routinely take longer than that.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static File Storage & PDFs -- an allowlist, not the whole storage
    # volume. The volume also holds the SQLite database (carlink.db, -wal,
    # -shm), tmp uploads and backups, and /files/ used to proxy all of it:
    # the live database was downloadable until 2026-10-21. The API enforces
    # the same allowlist (_PUBLIC_FILE_PREFIXES in app/api/main.py).
    location ^~ /files/incidents/ {
        proxy_pass http://api:8000/files/incidents/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # private: these are case photos behind a login -- shared caches
        # must not keep copies. The API sends its own "public" header, which
        # is dropped so the response doesn't carry two contradictory ones.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, max-age=31536000, immutable";
    }

    location ^~ /files/intake/ {
        proxy_pass http://api:8000/files/intake/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, max-age=31536000, immutable";
    }

    location /files/ {
        return 404;
    }
}
