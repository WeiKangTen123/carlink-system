server {
    listen 80;
    server_name _;

    # Without this, nginx's default (1M) silently rejects any realistic
    # multi-photo incident report upload -- a handful of phone-camera
    # photos clears 1MB easily. 100M covers a large batch of full-res
    # evidence photos with headroom.
    client_max_body_size 100M;

    # Web Dashboard UI (Next.js)
    location / {
        proxy_pass http://dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # FastAPI REST Backend API
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # nginx's 60s default proxy_read_timeout cuts off report
        # creation/analysis for reports with many photos -- PDF rendering
        # (Playwright/Chromium) and multi-photo Gemini analysis both
        # routinely take longer than that.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static File Storage & PDFs
    location /files/ {
        proxy_pass http://api:8000/files/;
        proxy_set_header Host $host;
    }
}
