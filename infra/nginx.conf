server {
    listen 80;
    server_name _;

    # Web Dashboard UI (Next.js)
    location / {
        proxy_pass http://dashboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # FastAPI REST Backend API
    location /api/ {
        proxy_pass http://bot-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Static File Storage & PDFs
    location /files/ {
        proxy_pass http://bot-service:8000/files/;
        proxy_set_header Host $host;
    }

    # Direct PDF Download Route
    location /reports/ {
        proxy_pass http://bot-service:8000/reports/;
        proxy_set_header Host $host;
    }
}
