# Host nginx site for Carlink PRODUCTION on the shared VM
# (instance-20261104-111232, 34.16.92.98; shared with the Solv and Xero apps):
# /etc/nginx/sites-enabled/carlink-app. Terminates HTTPS for
# carlink.34-16-92-98.sslip.io and proxies to the Carlink nginx container,
# which is bound to 127.0.0.1:8080 (infra/docker-compose.prod.yml) and does
# the routing (infra/nginx.conf); the api does the sign-in.
#
# Kept here so it is version-controlled; it is not deployed by deploy.sh.
# After editing on the server: sudo nginx -t && sudo systemctl reload nginx
# The ssl_* lines are managed by Certbot. On this server one certificate,
# "34-16-92-98.sslip.io", covers the bare name and the carlink. and solv.
# names, so the live file's ssl_certificate paths name that certificate;
# compare with the live file before copying this one over it.
# The staging site is carlink-staging.conf (next to this file).
server {
    server_name carlink.34-16-92-98.sslip.io;

    # Matches the inner nginx (one photo per intake upload, 25MB cap).
    client_max_body_size 30M;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Same as the inner nginx: creating a case renders its PDF in the
        # request, which for a 65-photo case runs past nginx's 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/34-16-92-98.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/34-16-92-98.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = carlink.34-16-92-98.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name carlink.34-16-92-98.sslip.io;
    return 404; # managed by Certbot
}
