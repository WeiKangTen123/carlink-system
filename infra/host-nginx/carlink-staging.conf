# Host nginx site for Carlink STAGING on the shared VM (34.16.92.98):
# /etc/nginx/sites-available/carlink-staging, linked from sites-enabled.
# Proxies carlink-staging.34-16-92-98.sslip.io to the staging stack's nginx
# container on 127.0.0.1:8081 (infra/docker-compose.staging.yml).
#
# Staging must not be a second public front door. It is guarded by the app's
# own sign-in, with signups switched off (deploy.sh's staging smoke checks
# both). The owner chose on 23 Nov 2026 to have no basic-auth pop-up in front
# of it: one sign-in page, as on production. On top of that:
#   - any Authorization header is NOT passed on to the app (Authorization "");
#   - noindex on every answer, and a robots.txt that disallows everything;
#   - its own certificate (certbot --nginx -d <this name>), so production's
#     shared certificate is never touched.
#
# Kept here so it is version-controlled; it is not deployed by deploy.sh.
# The owner adds it with sudo (app-site refuses carlink* names on purpose).
# Steps (infra/README.md "First setup of staging", step 5). A site that fails `nginx -t` and stays in sites-enabled breaks the
# NEXT reload (a certbot renewal) or reboot for Solv and Xero too -- so every
# `nginx -t` has its undo (review L10):
#   sudo cp /opt/carlink-staging/infra/host-nginx/carlink-staging.conf /etc/nginx/sites-available/carlink-staging
#   sudo ln -s /etc/nginx/sites-available/carlink-staging /etc/nginx/sites-enabled/carlink-staging
#   sudo nginx -t && sudo systemctl reload nginx || sudo rm /etc/nginx/sites-enabled/carlink-staging
#   sudo certbot --nginx -d carlink-staging.34-16-92-98.sslip.io --redirect   # adds the 443 lines + redirect
#   sudo nginx -t && sudo systemctl reload nginx || { sudo rm /etc/nginx/sites-enabled/carlink-staging; sudo nginx -t && sudo systemctl reload nginx; }
# Certbot rewrites this server block (listen 443 ssl, ssl_* lines, and a
# port-80 block that redirects); that live file is then the one to keep.
# Until https serves /login, a password would travel over plain http: don't
# use staging before that (deploy.sh's staging smoke fails until it does).
server {
    server_name carlink-staging.34-16-92-98.sslip.io;
    listen 80;

    # Matches the inner nginx (one photo per intake upload, 25MB cap).
    client_max_body_size 30M;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;


    # Nothing here is for search engines.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # No Authorization header from outside reaches the app (as before; the
        # parts worker's Bearer route is internal only).
        proxy_set_header Authorization "";
        proxy_cache_bypass $http_upgrade;
        # As production: creating a case renders its PDF in the request.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
